<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04061a"/><stop offset=".55" stop-color="#0a1934"/><stop offset="1" stop-color="#15364c"/></linearGradient>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ff2b0" stop-opacity="0"/><stop offset=".22" stop-color="#3ff2b0"/><stop offset=".58" stop-color="#2cc4ec"/><stop offset=".88" stop-color="#9b7bff"/><stop offset="1" stop-color="#9b7bff" stop-opacity="0"/></linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#fff" stop-opacity=".85"/><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="rays" width="61" height="1080" patternUnits="userSpaceOnUse"><rect width="61" height="1080" fill="#fff" opacity=".5"/><rect width="5" height="1080" fill="#fff"/><rect x="9" width="2" height="1080" fill="#fff" opacity=".8"/><rect x="19" width="7" height="1080" fill="#fff" opacity=".9"/><rect x="33" width="3" height="1080" fill="#fff"/><rect x="44" width="9" height="1080" fill="#fff" opacity=".75"/><rect x="57" width="2" height="1080" fill="#fff" opacity=".9"/></pattern>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04061a"/><stop offset=".12" stop-color="#04061a" stop-opacity=".9"/><stop offset=".42" stop-color="#071230" stop-opacity="0"/></linearGradient>
    <filter id="b1" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="b2" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="r"><feGaussianBlur stdDeviation="2 0"/></filter>
    <mask id="curtain" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect width="1920" height="1080" fill="url(#rays)" filter="url(#r)"/></mask>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11324a"/><stop offset="1" stop-color="#03070f"/></linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2f48"/><stop offset="1" stop-color="#0a1424"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g fill="#e6edff"><circle cx="140" cy="90" r="1.6" opacity=".9"/><circle cx="420" cy="160" r="1.2" opacity=".7"/><circle cx="700" cy="70" r="1.8"/><circle cx="980" cy="130" r="1.1" opacity=".6"/><circle cx="1260" cy="60" r="1.5" opacity=".8"/><circle cx="1500" cy="150" r="1.2" opacity=".7"/><circle cx="1780" cy="90" r="1.7"/><circle cx="300" cy="260" r="1" opacity=".6"/><circle cx="1650" cy="300" r="1.1" opacity=".6"/><circle cx="860" cy="230" r="1" opacity=".5"/><circle cx="560" cy="40" r="1.3" opacity=".8"/><circle cx="1120" cy="200" r="1" opacity=".5"/></g>
  <!-- the glow behind the lights, then the curtains with their rays -->
  <path d="M-100 560 C 300 340 620 600 980 420 S 1600 260 2020 360 L2020 520 C 1600 440 1300 640 980 580 S 300 580 -100 700 Z" fill="url(#au)" opacity=".35" filter="url(#b2)"/>
  <g mask="url(#curtain)">
    <path d="M-100 200 C 300 60 620 300 980 140 S 1600 10 2020 100 L2020 520 C 1600 440 1300 640 980 580 S 300 580 -100 700 Z" fill="url(#au)" opacity=".9" filter="url(#b1)"/>
  </g>
  <g mask="url(#curtain)" opacity=".45">
    <path d="M200 60 C 600 -40 900 160 1300 40 S 1800 -20 2020 20 L2020 330 C 1800 300 1500 430 1300 390 S 600 360 200 470 Z" fill="url(#au)" filter="url(#b1)"/>
  </g>
  <!-- the curtains fade out as they rise -->
  <rect width="1920" height="1080" fill="url(#dusk)"/>
  <path d="M0 770 L160 640 L280 700 L470 530 L620 680 L760 620 L900 715 L1080 560 L1230 690 L1390 600 L1560 715 L1730 630 L1920 735 L1920 820 L0 820 Z" fill="url(#ridge)"/>
  <path d="M0 805 L240 712 L420 765 L620 700 L820 785 L1040 708 L1260 795 L1480 718 L1700 785 L1920 728 L1920 830 L0 830 Z" fill="#060d1a"/>
  <rect y="825" width="1920" height="255" fill="url(#lake)"/>
  <g opacity=".22" transform="translate(0 1650) scale(1 -1)"><path d="M-100 560 C 300 340 620 600 980 420 S 1600 260 2020 360 L2020 520 C 1600 440 1300 640 980 580 S 300 580 -100 700 Z" fill="url(#au)" filter="url(#b2)"/></g>
  <rect y="825" width="1920" height="2" fill="#7fe9d0" opacity=".12"/>
</svg>
